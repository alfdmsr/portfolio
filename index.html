<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/almas.dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var r = document.documentElement;
        var s = null;
        try {
          s = localStorage.getItem("portfolio-theme");
        } catch (e) {}
        var t =
          s === "light" || s === "dark"
            ? s
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        r.dataset.theme = t;
      })();
    </script>
    <meta
      name="description"
      content="Alif Masrur — Machine Learning & Software Engineer. Portfolio proyek ML, deep learning, dan MLOps."
    />
    <meta
      name="theme-color"
      content="#f5f6f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#131518"
      media="(prefers-color-scheme: dark)"
    />
    <title>almas.sys — Alif Masrur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
